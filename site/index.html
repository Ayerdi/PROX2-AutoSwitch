<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Audio AutoSwitch — cambia automáticamente la salida de audio de Windows cuando conectas o desconectas tu auricular inalámbrico. Automatically switch your Windows default audio output when you connect or disconnect your wireless headset.">
<title>Audio AutoSwitch</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-soft: #111624;
    --card: #161c2c;
    --card-border: #232c44;
    --text: #e6eaf3;
    --muted: #9aa4bd;
    --accent: #35d07f;
    --accent-dim: #20b866;
    --blue: #4ea1ff;
    --code-bg: #0d121f;
    --code-border: #1f2940;
    --radius: 14px;
    --mono: "SFMono-Regular", "Cascadia Code", "Consolas", "Menlo", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(1100px 500px at 85% -10%, rgba(53,208,127,.08), transparent 60%),
      radial-gradient(900px 450px at -10% 15%, rgba(78,161,255,.07), transparent 60%);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
    min-height: 100vh;
  }

  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; }

  /* ---------- language switcher ---------- */
  .lang {
    position: fixed;
    top: 16px;
    right: 20px;
    z-index: 50;
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .lang button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .lang button.active { background: var(--accent); color: #04120a; }

  /* ---------- header ---------- */
  header { padding: 72px 0 28px; }
  .badges { margin-bottom: 18px; }
  .badges svg { height: 22px; vertical-align: middle; margin-right: 8px; }
  h1 {
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.1;
  }
  h1 .accent { color: var(--accent); }
  .tagline {
    margin-top: 14px;
    color: var(--muted);
    font-size: clamp(15px, 2.4vw, 18px);
    max-width: 640px;
  }

  /* ---------- sections ---------- */
  main { padding-bottom: 60px; }

  section { margin-top: 44px; }

  h2 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.01em;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h2 .dot { color: var(--accent); }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .card + .card { margin-top: 14px; }

  .card h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }

  p { color: var(--text); }
  p.muted, li { color: var(--muted); }
  p + p { margin-top: 10px; }

  ul, ol { padding-left: 22px; margin-top: 10px; }
  li + li { margin-top: 6px; }
  li strong, p strong { color: var(--text); }

  code {
    font-family: var(--mono);
    font-size: .9em;
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 6px;
    padding: 2px 6px;
    color: #cfe9ff;
    word-break: break-all;
  }

  pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    overflow-x: auto;
    margin-top: 12px;
    line-height: 1.55;
  }
  pre code {
    background: none;
    border: none;
    padding: 0;
    color: #b7e4ff;
    font-size: .88em;
    word-break: normal;
  }

  .copy {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .copy.ok { color: var(--accent); border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

  .demo {
    display: block;
    max-width: 100%;
    margin: 16px auto 0;
    border-radius: var(--radius);
    border: 1px solid var(--card-border);
  }
  .demo-caption {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
  }
  .demo-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 680px) { .demo-row { grid-template-columns: 1fr; } }

  .pill {
    display: inline-block;
    background: rgba(53,208,127,.12);
    border: 1px solid rgba(53,208,127,.35);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .steps { counter-reset: step; list-style: none; padding-left: 0; }
  .steps li {
    counter-increment: step;
    position: relative;
    padding-left: 34px;
    margin-top: 14px;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 2px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: #04120a;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  blockquote {
    border-left: 3px solid var(--blue);
    background: rgba(78,161,255,.07);
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
    margin-top: 14px;
    color: var(--muted);
  }

  footer {
    border-top: 1px solid var(--card-border);
    padding: 26px 0 40px;
    color: var(--muted);
    font-size: 13px;
  }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
</style>
</head>

<div class="lang" role="group" aria-label="Idioma / Language">
  <button id="btn-es" class="active">ES</button>
  <button id="btn-en">EN</button>

<header class="wrap">
  <div class="badges">
    <a href="https://github.com/Ayerdi/PROX2-AutoSwitch/actions/workflows/validate.yml" aria-label="CI">
      <img src="https://github.com/Ayerdi/PROX2-AutoSwitch/actions/workflows/validate.yml/badge.svg" alt="validate">
    </a>
    <a href="https://github.com/Ayerdi/PROX2-AutoSwitch/blob/main/LICENSE" aria-label="License">
      <img src="https://img.shields.io/badge/License-MIT-yellow.svg" alt="MIT">

<main class="wrap">

  <!-- what -->
  <section id="what">

  <!-- why -->

      <p data-i18n="why1"></p>

  <!-- how -->

  <!-- install -->
  <section id="install">

    <div class="card">
      <span class="pill">install.ps1</span>

      <p data-i18n="quick1"></p>

      <pre><code data-i18n="manualCmd"></code></pre>
      <button class="copy" data-copy="manualCmd"><span data-i18n="copyBtn"></span></button>
    </div>

    <div class="card">
      <h3 data-i18n="whatInstallerDoesTitle"></h3>
      <ol class="steps">
        <li data-i18n="id1"></li>
        <li data-i18n="id2"></li>
        <li data-i18n="id3"></li>
        <li data-i18n="id4"></li>
        <li data-i18n="id5"></li>
      </ol>
      <blockquote data-i18n="idNote"></blockquote>
    </div>
  </section>

  <!-- requirements -->
  <section id="reqs">
    <h2><span class="dot">●</span> <span data-i18n="reqsTitle"></span></h2>
    <div class="card grid">
      <div>
        <ul>
          <li data-i18n="req1"></li>
          <li data-i18n="req2"></li>
          <li data-i18n="req3"></li>
        </ul>
      </div>
      <div>
        <ul>
          <li data-i18n="req4"></li>
          <li data-i18n="req5"></li>
        </ul>
      </div>
    </div>
  </section>

  <!-- verify -->
  <section id="verify">
    <h2><span class="dot">●</span> <span data-i18n="verifyTitle"></span></h2>
    <div class="card">
      <pre><code data-i18n="verifyCmd"></code></pre>
      <button class="copy" data-copy="verifyCmd"><span data-i18n="copyBtn"></span></button>
      <ol class="steps" style="margin-top:16px">
        <li data-i18n="v1"></li>
        <li data-i18n="v2"></li>
        <li data-i18n="v3"></li>
        <li data-i18n="v4"></li>
        <li data-i18n="v5"></li>

  </section>

  <!-- security -->
  <section id="security">

  </section>

</main>

    <span><a href="https://github.com/Ayerdi/PROX2-AutoSwitch">github.com/Ayerdi/PROX2-AutoSwitch</a></span>
  </div>
</footer>

  var el = {};
  document.querySelectorAll("[data-i18n]").forEach(function (n) {
    el[n.getAttribute("data-i18n")] = n;
  });

  function setLang(lang) {
    if (!T[lang]) { lang = "es"; }
    var t = T[lang];
    Object.keys(t).forEach(function (k) {
      if (el[k]) {
        if (k.indexOf("what") === 0 || k.indexOf("sec") === 0 || k.indexOf("id") === 0 || k.indexOf("demo") === 0) {
          el[k].innerHTML = t[k];
        } else {
          el[k].textContent = t[k];
        }
      }
    });
    document.documentElement.lang = lang;
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.classList.toggle("active", b.id === "btn-" + lang);
    });
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }

  function copy(elBtn) {
    var key = elBtn.getAttribute("data-copy");
    var text = (el[key] && el[key].textContent) || "";
    navigator.clipboard.writeText(text).then(function () {
      var label = elBtn.querySelector("[data-i18n]");
      var original = label.textContent;
      var ok = (document.documentElement.lang === "es") ? "✓ Copiado" : "✓ Copied";
      label.textContent = ok;
      elBtn.classList.add("ok");
      setTimeout(function () {
        label.textContent = original;
        elBtn.classList.remove("ok");
      }, 1600);
    }).catch(function () {});
  }

  document.getElementById("btn-es").addEventListener("click", function () { setLang("es"); });
  document.getElementById("btn-en").addEventListener("click", function () { setLang("en"); });
  document.querySelectorAll(".copy").forEach(function (b) {
    b.addEventListener("click", function () { copy(b); });
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var detected = (navigator.language || "es").slice(0, 2).toLowerCase();
  setLang(saved && T[saved] ? saved : (DEFAULTS.indexOf(detected) !== -1 ? detected : "es"));
})();
</script>
</body>
</html>
