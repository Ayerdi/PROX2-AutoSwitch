name: Publish v1.2.5

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.2.5.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip if release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: if gh release view v1.2.5 >/dev/null 2>&1; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - name: Scan and build twice
        if: steps.existing.outputs.exists == 'false'
        run: |
          bash scripts/run-gitleaks.sh
          bash scripts/build-release.sh 1.2.5
          cp dist/PROX2-AutoSwitch-v1.2.5.zip /tmp/first.zip
          first="$(cut -d' ' -f1 dist/PROX2-AutoSwitch-v1.2.5.zip.sha256)"
          rm -f dist/*.zip dist/*.sha256
          bash scripts/build-release.sh 1.2.5
          second="$(cut -d' ' -f1 dist/PROX2-AutoSwitch-v1.2.5.zip.sha256)"
          test "$first" = "$second"
          cmp /tmp/first.zip dist/PROX2-AutoSwitch-v1.2.5.zip
      - name: Publish v1.2.5
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.2.5 dist/PROX2-AutoSwitch-v1.2.5.zip dist/PROX2-AutoSwitch-v1.2.5.zip.sha256 dist/Audio-AutoSwitch.zip dist/Audio-AutoSwitch.zip.sha256 --target "$GITHUB_SHA" --title 'v1.2.5 — English-first public structure' --notes 'English-first repository and Pages, fully bilingual Wiki source, canonical English PowerShell entrypoints, deterministic release packaging and CI hardening. Detection behavior is unchanged.'
