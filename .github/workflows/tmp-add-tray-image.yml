name: tmp-add-tray-image

on:
  push:
    paths:
      - '.github/workflows/tmp-add-tray-image.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add tray screenshot to repo docs
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/tray-menu.b64
          mkdir -p site/assets
          base64 -d .github/tray-menu.b64 > site/assets/tray-menu.png
          test "$(head -c 8 site/assets/tray-menu.png | xxd -p)" = "89504e470d0a1a0a"
          python3 .github/tmp_add_tray_image.py repo
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md site/index.html site/assets/tray-menu.png
          git commit -m "docs: add tray menu screenshot"
          git push origin HEAD:main

      - name: Update wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wiki
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki
          python3 .github/tmp_add_tray_image.py wiki /tmp/wiki
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Home.md Verificar-ES.md Verify-EN.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "docs: add tray menu screenshot"
            git push origin HEAD
          fi

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/tray-menu.b64 .github/tmp_add_tray_image.py .github/workflows/tmp-add-tray-image.yml
          git commit -m "chore: remove tray screenshot tooling"
          git push origin HEAD:main
