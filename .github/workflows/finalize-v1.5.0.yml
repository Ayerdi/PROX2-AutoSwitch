name: Finalize v1.5.0 fixes

on:
  push:
    branches:
      - fix/prox2-centurion-hid
    paths:
      - '.github/workflows/finalize-v1.5.0.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/prox2-centurion-hid
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final fixes
        run: python3 scripts/finalize-v1.5.0.py

      - name: Remove one-shot patch script
        run: rm scripts/finalize-v1.5.0.py

      - name: Validate repository and package
        run: |
          python3 scripts/check-repository.py
          python3 scripts/check-language.py
          bash -n scripts/*.sh
          bash scripts/build-release.sh 1.5.0

      - name: Commit final fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize v1.5.0 release details'
          git push origin HEAD:fix/prox2-centurion-hid
