name: Temporary final English cleanup

on:
  push:
    branches:
      - agent/repository-standard-v1.2.5
    paths:
      - .github/workflows/tmp-final-language-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/repository-standard-v1.2.5
      - name: Apply reviewed translations
        shell: python
        run: |
          from pathlib import Path

          mappings = {
            Path('Runtime-PROX2-AutoSwitch.ps1'): [
              ('# Migracion de config v1.1.0 -> v1.2.0: se anade DetectionMode si falta.', '# Config migration v1.1.0 -> v1.2.0: add DetectionMode when missing.'),
              ('# El worker (AUTOSWITCH_WORKER=1) es un proceso hijo legitimo del runtime y', '# The worker (AUTOSWITCH_WORKER=1) is a legitimate child process of the runtime and'),
              ('# Token de timeout G HUB: definido en lib\\AutoSwitchCore.psm1 (importado arriba).', '# G HUB timeout token: defined in lib\\AutoSwitchCore.psm1 (imported above).'),
              ('throw "Timeout al conectar con G HUB ($($script:ConnectTimeoutMs) ms)."', 'throw "Timed out connecting to G HUB ($($script:ConnectTimeoutMs) ms)."'),
              ('throw "Timeout al enviar peticion a G HUB ($($script:ReceiveTimeoutMs) ms)."', 'throw "Timed out sending a request to G HUB ($($script:ReceiveTimeoutMs) ms)."'),
              ('# Deadline duro de la peticion: ningun fragmento puede cruzar este punto.', '# Hard request deadline: no fragment may cross this point.'),
              ('throw "Timeout de peticion G HUB ($($script:RequestTimeoutMs) ms)."', 'throw "G HUB request timed out ($($script:RequestTimeoutMs) ms)."'),
              ('# del deadline global de la peticion.', '# the request-wide deadline.'),
              ('throw "Timeout esperando respuesta de G HUB ($($fragmentMs) ms)."', 'throw "Timed out waiting for a G HUB response ($($fragmentMs) ms)."'),
              ('throw "G HUB cerro el WebSocket."', 'throw "G HUB closed the WebSocket."'),
              ('# Limite global por peticion: aunque G HUB intercale eventos,', '# Request-wide deadline: even if G HUB interleaves events,'),
              ('throw "Timeout de peticion G HUB ($($script:RequestTimeoutMs) ms): $Path"', 'throw "G HUB request timed out ($($script:RequestTimeoutMs) ms): $Path"'),
              ('# G HUB puede intercalar eventos asincronos.', '# G HUB may interleave asynchronous events.'),
              ('throw "G HUB no devuelve el PRO X 2 en /devices/list."', 'throw "G HUB did not return the PRO X 2 in /devices/list."'),
              ('Write-AutoSwitchLog ("PRO X 2 detectado por G HUB: {0} ({1})" -f $headset.extendedDisplayName, $headset.id)', 'Write-AutoSwitchLog ("PRO X 2 detected by G HUB: {0} ({1})" -f $headset.extendedDisplayName, $headset.id)'),
              ('# IMPORTANTE: /GetColumnValue ya escribe el valor en stdout.', '# IMPORTANT: /GetColumnValue already writes the value to stdout.'),
              ('Write-AutoSwitchLog "Output changed -> $Label (segundo intento)"', 'Write-AutoSwitchLog "Output changed -> $Label (second attempt)"'),
              ('throw "svcl no consiguio establecer \'$Label\'. Esperado=$DeviceId Actual=$actual"', 'throw "svcl could not set \'$Label\'. Expected=$DeviceId Actual=$actual"'),
              ('# --- Estado del endpoint de Windows (DetectionMode=WindowsEndpoint) ---', '# --- Windows endpoint state (DetectionMode=WindowsEndpoint) ---'),
              ('# Exporta TODOS los items de sonido en CSV. /scomma "" lista todo.', '# Export ALL sound items as CSV. /scomma "" lists everything.'),
              ("Devuelve 'Connected' / 'Disconnected' / 'Unknown' del endpoint del headset.", "Returns 'Connected' / 'Disconnected' / 'Unknown' for the headset endpoint."),
              ('- Export valido + fila con Item ID coincidente -> estado normalizado.', '- Valid export + matching Item ID row -> normalized state.'),
              ('- Export valido + fila ausente (endpoint no presente) -> Disconnected.', '- Valid export + missing row (endpoint not present) -> Disconnected.'),
              ('# svcl no devolvio un export valido: estado desconocido, NO asumir off.', '# svcl did not return a valid export: state is unknown; do NOT assume off.'),
              ('# que no esta presente -> Disconnected.', '# endpoint is not present -> Disconnected.'),
              ('# El polling corre en un proceso PowerShell aparte (worker) para no bloquear', '# Polling runs in a separate PowerShell worker process so it does not block'),
              ('# hace polling con su propio guard anti-concurrencia (no lanza un poll si el', '# performs polling with its own concurrency guard (it does not start another poll if the'),
              ('# anterior sigue en marcha).', '# previous poll is still running).'),
              ("# Lee el estado actual de SysFx del headset y devuelve 'Disable' o 'Enable'.", "# Read the headset's current SysFx state and return 'Disable' or 'Enable'."),
              ("if ($fx) { return 'Enable' }   # ya deshabilitados -> ofrecer habilitar", "if ($fx) { return 'Enable' }   # already disabled -> offer enable"),
              ("return 'Disable'               # habilitados -> ofrecer deshabilitar", "return 'Disable'               # enabled -> offer disable"),
              ('# --- Reconfigurar headset/fallback sin reinstalar ---', '# --- Reconfigure headset/fallback without reinstalling ---'),
              ('# Fallback de identidad: un endpoint Bluetooth puede reaparecer con otro', '# Identity fallback: a Bluetooth endpoint may return with a different'),
              ('# Item ID. No usar la etiqueta visible "Device Name — Name" como si fuera', '# Item ID. Do not treat the visible "Device Name — Name" label as'),
              ('Write-AutoSwitchLog ("Get-HeadsetStateForId: {0} no encontrado por Item ID; identidad DeviceName=\'{1}\' Name=\'{2}\' -> nuevo Item ID {3}" -f $ItemId, $DeviceName, $EndpointName, $id)', 'Write-AutoSwitchLog ("Get-HeadsetStateForId: {0} was not found by Item ID; identity DeviceName=\'{1}\' Name=\'{2}\' -> new Item ID {3}" -f $ItemId, $DeviceName, $EndpointName, $id)'),
              ('# Que hay en la exportacion? Render devices con sus estados e IDs.', '# What is in the export? Render devices with their states and IDs.'),
              ('Write-AutoSwitchLog ("Get-HeadsetStateForId: fila para {0} sin columna de estado" -f $ItemId)', 'Write-AutoSwitchLog ("Get-HeadsetStateForId: row for {0} has no state column" -f $ItemId)'),
              ('o expire el timeout. Un headset Bluetooth (p. ej. Jabra) puede tardar', 'or the timeout expires. A Bluetooth headset (for example Jabra) may take'),
              ('varios segundos en reflejar el cambio fisico en Windows; una lectura', 'several seconds to expose the physical-state change in Windows; a single read'),
              ('unica a los 500/800 ms lee demasiado pronto. Tambien puede desaparecer', 'at 500/800 ms may be too early. The endpoint may also disappear'),
              ('devuelve el Item ID observado.', 'returns the observed Item ID.'),
              ('# Timeout: el estado observado no alcanzo el esperado. Diagnostico con contexto.', '# Timeout: the observed state did not reach the expected state. Log context for diagnosis.'),
              ('Write-AutoSwitchLog ("Wait-ForHeadsetState: timeout esperando \'{0}\' para {1}. Ultimo estado observado: {2}" -f $Expected, $ItemId, $last)', 'Write-AutoSwitchLog ("Wait-ForHeadsetState: timed out waiting for \'{0}\' on {1}. Last observed state: {2}" -f $Expected, $ItemId, $last)'),
              ('# Preseleccionar los valores actuales.', '# Preselect the current values.'),
              ('# aparte (AUTOSWITCH_WORKER=1) para no bloquear el hilo de WinForms (tray).', '# (AUTOSWITCH_WORKER=1) so it does not block the WinForms tray thread.'),
              ('# no se lanza otro poll hasta que termine.', '# no new poll starts until it completes.'),
              ('# acceso a TODAS las funciones (G HUB, audio, endpoint) sin duplicarlas.', '# access to ALL functions (G HUB, audio, endpoint) without duplicating them.'),
              ('# Actualiza la variable global del script (no crear local).', '# Update the script-global variable (do not create a local copy).'),
              ('Write-AutoSwitchLog ("WindowsEndpoint no disponible: {0}. Se reintentara." -f $_.Exception.Message)', 'Write-AutoSwitchLog ("WindowsEndpoint unavailable: {0}. It will retry." -f $_.Exception.Message)'),
              ('# Submenu de reconfiguracion (elegir headset/fallback sin reinstalar).', '# Reconfiguration submenu (choose headset/fallback without reinstalling).'),
              ('# en el hilo de UI; Get-EndpointFxState es una lectura COM ligera.', '# on the UI thread; Get-EndpointFxState is a lightweight COM read.'),
              ('# notificaciones procesa eventos aqui; se mantiene activa hasta Exit.', '# notification system processes events here and remains active until Exit.'),
            ],
            Path('Toggle-AudioEnhancements.ps1'): [
              ('# un unico metodo estatico que hace Set + verifica internamente.', '# one static method that performs Set + internal verification.'),
            ],
            Path('lib/AutoSwitchCore.psm1'): [
              ('// Devuelve: 1 = SysFx deshabilitado, 0 = SysFx habilitado,', '// Returns: 1 = SysFx disabled, 0 = SysFx enabled,'),
              ('// PKEY_AudioEndpoint_Disable_SysFx, por lo que leeria siempre', '// PKEY_AudioEndpoint_Disable_SysFx, so reading it there would always'),
              ('Resuelve el DetectionMode de una config, con migracion implicita.', 'Resolve DetectionMode from a config, including implicit migration.'),
              ('Si $Config ya tiene DetectionMode, lo devuelve validado', 'If $Config already has DetectionMode, return the validated value'),
              ("('WindowsEndpoint' o 'LogitechGHub'). Si no existe, devuelve", "('WindowsEndpoint' or 'LogitechGHub'). If absent, return"),
              ('Devuelve $null si el valor existente no es valido.', 'Return $null when an existing value is invalid.'),
            ],
          }

          for path, pairs in mappings.items():
              encoding = 'utf-8-sig' if path.suffix.lower() in {'.ps1', '.psm1'} else 'utf-8'
              text = path.read_text(encoding=encoding)
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding=encoding)

      - name: Commit cleanup
        run: |
          git config user.name "Ayerdi"
          git config user.email "128999164+Ayerdi@users.noreply.github.com"
          git add Runtime-PROX2-AutoSwitch.ps1 Toggle-AudioEnhancements.ps1 lib/AutoSwitchCore.psm1
          git commit -m "refactor: finish English runtime diagnostics"
          git push origin HEAD:agent/repository-standard-v1.2.5
