name: publish-current-release

on:
  workflow_run:
    workflows: [release-readiness]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-current-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve validated main commit
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"

          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            release_sha="$WORKFLOW_HEAD_SHA"
          else
            release_sha="$(git rev-parse HEAD)"
            state="$(gh run list --workflow release-readiness.yml --branch main --limit 1 --json headSha,status,conclusion --jq '.[0] | (.headSha // "") + ":" + (.status // "") + ":" + (.conclusion // "")')"
            test "$state" = "${release_sha}:completed:success"
          fi

          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_main" != "$release_sha" ]]; then
            echo "Current readiness run is stale; main has advanced. A newer run will decide publication."
            echo 'stale=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stale=false' >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release source
        if: steps.release.outputs.stale == 'false' && steps.release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 scripts/check-repository.py
          python3 scripts/check-language.py
          bash scripts/run-gitleaks.sh
          python3 scripts/check-release-readiness.py --version "$VERSION" --source-only

      - name: Build and validate deterministic release twice
        if: steps.release.outputs.stale == 'false' && steps.release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          bash scripts/build-release.sh "$VERSION"
          first="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${VERSION}.zip.sha256")"
          first_copy="$(mktemp /tmp/autoswitch-release.XXXXXX.zip)"
          trap 'rm -f -- "$first_copy"' EXIT
          cp "dist/PROX2-AutoSwitch-v${VERSION}.zip" "$first_copy"
          rm -f dist/*.zip dist/*.sha256
          bash scripts/build-release.sh "$VERSION"
          second="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${VERSION}.zip.sha256")"
          test "$first" = "$second"
          cmp "$first_copy" "dist/PROX2-AutoSwitch-v${VERSION}.zip"
          cmp "dist/PROX2-AutoSwitch-v${VERSION}.zip" dist/Audio-AutoSwitch.zip
          python3 scripts/check-release-readiness.py --version "$VERSION" --package-only

      - name: Publish validated stable release
        if: steps.release.outputs.stale == 'false' && steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          tag="v${VERSION}"
          notes="docs/RELEASE-NOTES-v${VERSION}.md"
          gh release create "$tag" \
            "dist/PROX2-AutoSwitch-v${VERSION}.zip" \
            "dist/PROX2-AutoSwitch-v${VERSION}.zip.sha256" \
            dist/Audio-AutoSwitch.zip \
            dist/Audio-AutoSwitch.zip.sha256 \
            --target "$RELEASE_SHA" \
            --title "$tag" \
            --notes-file "$notes"

          expected="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${VERSION}.zip.sha256")"
          uploaded="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[] | select(.name == "PROX2-AutoSwitch-v'"${VERSION}"'.zip") | (.digest // "")')"
          test "$uploaded" = "sha256:${expected}"

      - name: Publication summary
        if: always()
        run: |
          {
            echo '## Stable release publisher'
            echo
            echo '- VERSION: `${{ steps.release.outputs.version }}`'
            echo '- Validated commit: `${{ steps.release.outputs.sha }}`'
            echo '- Existing release: `${{ steps.release.outputs.exists }}`'
            echo '- Stale readiness run: `${{ steps.release.outputs.stale }}`'
          } >> "$GITHUB_STEP_SUMMARY"
