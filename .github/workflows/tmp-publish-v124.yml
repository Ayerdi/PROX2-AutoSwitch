name: tmp-publish-v124

on:
  push:
    paths:
      - '.github/workflows/tmp-publish-v124.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.2.4
      RELEASE_SHA: 983bbecda0aae74ba1aae623a08ed914ee902622
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 983bbecda0aae74ba1aae623a08ed914ee902622
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git diff --exit-code

      - name: Build release ZIPs and checksums
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="PROX2-AutoSwitch-$VERSION"
          VERSIONED_ZIP="PROX2-AutoSwitch-$VERSION.zip"
          STABLE_ZIP="Audio-AutoSwitch.zip"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/lib" "$PACKAGE_DIR/assets"
          cp Install.cmd Verify.cmd Uninstall.cmd \
             Instalar-PROX2-AutoSwitch.ps1 \
             Runtime-PROX2-AutoSwitch.ps1 \
             Desinstalar-PROX2-AutoSwitch.ps1 \
             Verificar-PROX2-AutoSwitch.ps1 \
             Toggle-AudioEnhancements.ps1 \
             install.ps1 \
             README.md AGENT.md SOURCES.md SECURITY.md LICENSE CHANGELOG.md \
             "$PACKAGE_DIR/"
          cp lib/AutoSwitchCore.psm1 "$PACKAGE_DIR/lib/"
          cp assets/icon.ico "$PACKAGE_DIR/assets/"

          zip -r "$VERSIONED_ZIP" "$PACKAGE_DIR"
          sha256sum "$VERSIONED_ZIP" > "$VERSIONED_ZIP.sha256"
          cp "$VERSIONED_ZIP" "$STABLE_ZIP"
          sha256sum "$STABLE_ZIP" > "$STABLE_ZIP.sha256"

      - name: Validate packaged ZIPs
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="PROX2-AutoSwitch-$VERSION"
          VERSIONED_ZIP="PROX2-AutoSwitch-$VERSION.zip"
          STABLE_ZIP="Audio-AutoSwitch.zip"

          sha256sum -c "$VERSIONED_ZIP.sha256"
          sha256sum -c "$STABLE_ZIP.sha256"
          cmp "$VERSIONED_ZIP" "$STABLE_ZIP"

          unzip -Z1 "$STABLE_ZIP" | grep -Fx "$PACKAGE_DIR/Install.cmd"
          unzip -Z1 "$STABLE_ZIP" | grep -Fx "$PACKAGE_DIR/Verify.cmd"
          unzip -Z1 "$STABLE_ZIP" | grep -Fx "$PACKAGE_DIR/Uninstall.cmd"
          unzip -Z1 "$STABLE_ZIP" | grep -Fx "$PACKAGE_DIR/Instalar-PROX2-AutoSwitch.ps1"
          unzip -Z1 "$STABLE_ZIP" | grep -Fx "$PACKAGE_DIR/Runtime-PROX2-AutoSwitch.ps1"
          unzip -Z1 "$STABLE_ZIP" | grep -Fx "$PACKAGE_DIR/lib/AutoSwitchCore.psm1"
          unzip -Z1 "$STABLE_ZIP" | grep -Fx "$PACKAGE_DIR/assets/icon.ico"

          echo "VERSIONED_SHA256=$(sha256sum "$VERSIONED_ZIP" | cut -d' ' -f1)"
          echo "STABLE_SHA256=$(sha256sum "$STABLE_ZIP" | cut -d' ' -f1)"

      - name: Publish GitHub release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$VERSION" \
            "PROX2-AutoSwitch-$VERSION.zip" \
            "PROX2-AutoSwitch-$VERSION.zip.sha256" \
            "Audio-AutoSwitch.zip" \
            "Audio-AutoSwitch.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --generate-notes

          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,targetCommitish
