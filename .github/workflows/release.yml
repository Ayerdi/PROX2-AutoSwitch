name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: v
        run: |
          tag="${GITHUB_REF#refs/tags/}"; [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build twice and compare
        run: |
          v='${{ steps.v.outputs.version }}'; bash scripts/build-release.sh "$v"; cp "dist/PROX2-AutoSwitch-v${v}.zip" /tmp/first.zip; first="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${v}.zip.sha256")"; rm -f dist/*.zip dist/*.sha256; bash scripts/build-release.sh "$v"; second="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${v}.zip.sha256")"; test "$first" = "$second"; cmp /tmp/first.zip "dist/PROX2-AutoSwitch-v${v}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ steps.v.outputs.version }}'; tag='${{ steps.v.outputs.tag }}'; gh release create "$tag" dist/PROX2-AutoSwitch-v${v}.zip dist/PROX2-AutoSwitch-v${v}.zip.sha256 dist/Audio-AutoSwitch.zip dist/Audio-AutoSwitch.zip.sha256 --title "$tag" --generate-notes
