name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  powershell:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $scripts=Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1' }
          foreach($script in $scripts){$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error "$($script.FullName): $($_.Message)"};exit 1}}
      - name: Install validation modules
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $r=Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSAvoidUsingPlainTextForPassword,PSAvoidUsingCmdletAliases,PSAvoidUsingEmptyCatchBlock,PSUseApprovedVerbs,PSUseShouldProcessForStateChangingFunctions,PSUseSingularNouns
          if($r){$r|Format-Table -AutoSize|Out-String|Write-Host;exit 1}
      - name: Pester
        shell: powershell
        run: Import-Module Pester -RequiredVersion 5.9.0; Invoke-Pester -Path .\tests -CI

  publish:
    needs: powershell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and repository
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION=v${version}" >&2
            exit 1
          }
          python3 scripts/check-repository.py
          python3 scripts/check-language.py
          bash -n scripts/*.sh
          bash scripts/run-gitleaks.sh

      - name: Build deterministic release twice
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          bash scripts/build-release.sh "$version"
          first="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${version}.zip.sha256")"
          first_copy="$(mktemp /tmp/autoswitch.XXXXXX.zip)"
          trap 'rm -f -- "$first_copy"' EXIT
          cp "dist/PROX2-AutoSwitch-v${version}.zip" "$first_copy"
          rm -f dist/*.zip dist/*.sha256
          bash scripts/build-release.sh "$version"
          second="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${version}.zip.sha256")"
          test "$first" = "$second"
          cmp "$first_copy" "dist/PROX2-AutoSwitch-v${version}.zip"
          cmp "dist/PROX2-AutoSwitch-v${version}.zip" dist/Audio-AutoSwitch.zip

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*.zip'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          assets=(
            "dist/PROX2-AutoSwitch-v${version}.zip"
            "dist/PROX2-AutoSwitch-v${version}.zip.sha256"
            "dist/Audio-AutoSwitch.zip"
            "dist/Audio-AutoSwitch.zip.sha256"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            notes="docs/RELEASE-NOTES-v${version}.md"
            if [[ -f "$notes" ]]; then
              gh release create "$tag" "${assets[@]}" --verify-tag --title "$tag" --notes-file "$notes"
            else
              gh release create "$tag" "${assets[@]}" --verify-tag --title "$tag" --generate-notes
            fi
          fi
