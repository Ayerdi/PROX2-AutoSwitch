name: tmp-clean-tray-final

on:
  push:
    paths:
      - '.github/workflows/tmp-clean-tray-final.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/tray-final-refresh.tmp .github/workflows/tmp-clean-tray-final.yml
          git commit -m "chore: remove final tray docs refresh marker"
          git push origin HEAD:main
