name: tmp-polish-onboarding

on:
  push:
    paths:
      - '.github/workflows/tmp-polish-onboarding.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-hardening
          fetch-depth: 0

      - name: Polish README and changelog
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '### Recommended: download the ZIP\n\n1. Open the [latest release](https://github.com/Ayerdi/PROX2-AutoSwitch/releases/latest) and download `Audio-AutoSwitch.zip`.\n',
              '### Recommended: download the ZIP (v1.2.4+)\n\nReleases built with this onboarding flow publish both the versioned archive and a stable **`Audio-AutoSwitch.zip`** name. Until v1.2.4 is published, v1.2.3 remains the latest stable release and does not contain the `.cmd` launchers yet.\n\n1. Open the [latest release](https://github.com/Ayerdi/PROX2-AutoSwitch/releases/latest) and download `Audio-AutoSwitch.zip` (v1.2.4+).\n',
              1,
          )
          s = s.replace('Toggle-AudioEnhancements.ps1   # helper elevado (UAC) de enhancements', 'Toggle-AudioEnhancements.ps1   # elevated helper (UAC) for enhancements')
          s = s.replace('lib\\AutoSwitchCore.psm1    # lógica compartida', 'lib\\AutoSwitchCore.psm1    # shared logic')
          s = s.replace('control\\                   # flags de comunicación tray <-> worker', 'control\\                   # tray <-> worker control flags')
          p.write_text(s, encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '- Removed leftover one-shot documentation workflows/scripts from `.github/`.\n\n### Fixed\n- `Reconfigure...`',
              '- Removed leftover one-shot documentation workflows/scripts from `.github/`.\n- `Reconfigure...`',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Commit regular files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git commit -m "docs: clarify quick ZIP availability"
          git push origin HEAD:agent/onboarding-hardening
