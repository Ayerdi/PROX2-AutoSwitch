name: apply-reconfigure-hotfix

on:
  push:
    branches:
      - agent/fix-reconfigure-ghub-config

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-reconfigure-ghub-config
          fetch-depth: 0

      - name: Apply targeted runtime hotfix
        run: python .github/apply_reconfigure_hotfix.py

      - name: Commit runtime hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Runtime-PROX2-AutoSwitch.ps1
          git diff --cached --check
          git commit -m "fix: harden reconfigure G HUB config"
          git push origin HEAD:agent/fix-reconfigure-ghub-config
