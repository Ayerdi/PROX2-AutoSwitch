name: Prepare v1.5.0 branch

on:
  push:
    branches:
      - fix/prox2-centurion-hid
    paths:
      - '.github/workflows/prepare-v1.5.0.yml'
      - 'scripts/prepare-v1.5-runtime.py'
      - 'scripts/prepare-v1.5-docs.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/prox2-centurion-hid
          fetch-depth: 0
          persist-credentials: true

      - name: Apply v1.5.0 runtime/package changes
        run: python3 scripts/prepare-v1.5-runtime.py

      - name: Repair docs preparer syntax
        run: sed -i 's/if (ROOT\.joinpath(rel)\.exists():/if ROOT.joinpath(rel).exists():/g' scripts/prepare-v1.5-docs.py

      - name: Apply v1.5.0 docs/release changes
        run: python3 scripts/prepare-v1.5-docs.py

      - name: Keep workflow changes out of the Actions commit
        run: |
          rm -f .github/workflows/release-v1.5.0.yml
          git checkout -- scripts/prepare-v1.5-docs.py

      - name: Run repository checks available on Linux
        run: |
          python3 scripts/check-repository.py
          cp scripts/prepare-v1.5-runtime.py /tmp/prepare-v1.5-runtime.py
          cp scripts/prepare-v1.5-docs.py /tmp/prepare-v1.5-docs.py
          rm scripts/prepare-v1.5-runtime.py scripts/prepare-v1.5-docs.py
          python3 scripts/check-language.py
          mv /tmp/prepare-v1.5-runtime.py scripts/prepare-v1.5-runtime.py
          mv /tmp/prepare-v1.5-docs.py scripts/prepare-v1.5-docs.py
          bash -n scripts/*.sh
          bash scripts/build-release.sh 1.5.0

      - name: Commit prepared branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: prepare v1.5.0 PRO X 2 Centurion release'
            git push origin HEAD:fix/prox2-centurion-hid
          fi
