name: apply native Core Audio migration

on:
  push:
    branches:
      - agent/native-core-audio

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-core-audio
          fetch-depth: 0

      - name: Apply migration
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              enc = 'utf-8-sig' if Path(path).suffix.lower() in ('.ps1', '.psm1') else 'utf-8'
              Path(path).write_text(text, encoding=enc, newline='\n')

          def replace_once(text, old, new, path):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one exact match, found {count}: {old[:100]!r}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, path, flags=0):
              new, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {count}: {pattern[:120]!r}')
              return new

          native_ps = r'''
          function Initialize-CoreAudioBackend {
              <#
              .SYNOPSIS
                  Compile the in-process Windows Core Audio COM bridge once.
              .DESCRIPTION
                  PowerShell 5.1 cannot reliably cast COM RCWs to custom ComImport
                  interfaces, so the COM calls live in embedded C#. Enumeration,
                  endpoint state and default-device reads use documented Core Audio
                  interfaces. Setting the default endpoint reuses the project's
                  existing IPolicyConfig interop for Console, Multimedia and
                  Communications roles.
              #>
              [CmdletBinding()]
              param()

              if ('AutoSwitch.NativeAudio.CoreAudio' -as [type]) {
                  return
              }

              Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          namespace AutoSwitch.NativeAudio
          {
              [StructLayout(LayoutKind.Sequential, Pack = 4)]
              public struct PROPERTYKEY
              {
                  public Guid fmtid;
                  public uint pid;
              }

              [StructLayout(LayoutKind.Explicit)]
              public struct PROPVARIANT
              {
                  [FieldOffset(0)] public ushort vt;
                  [FieldOffset(8)] public IntPtr pointerVal;
                  [FieldOffset(8)] public uint ulVal;
              }

              [ComImport, Guid("BCDE0395-E52F-467C-8E3D-C4579291692E")]
              public class MMDeviceEnumeratorComObject { }

              [ComImport, Guid("870af99c-171d-4f9e-af0d-e63df40c2bc9")]
              public class CPolicyConfigVistaClient { }

              [ComImport, Guid("A95664D2-9614-4F35-A746-DE8DB63617E6"),
               InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              public interface IMMDeviceEnumerator
              {
                  [PreserveSig] int EnumAudioEndpoints(int dataFlow, uint stateMask, out IMMDeviceCollection devices);
                  [PreserveSig] int GetDefaultAudioEndpoint(int dataFlow, int role, out IMMDevice endpoint);
                  [PreserveSig] int GetDevice([MarshalAs(UnmanagedType.LPWStr)] string id, out IMMDevice device);
                  [PreserveSig] int RegisterEndpointNotificationCallback(IntPtr client);
                  [PreserveSig] int UnregisterEndpointNotificationCallback(IntPtr client);
              }

              [ComImport, Guid("0BD7A1BE-7A1A-44DB-8397-CC5392387B5E"),
               InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              public interface IMMDeviceCollection
              {
                  [PreserveSig] int GetCount(out uint count);
                  [PreserveSig] int Item(uint index, out IMMDevice device);
              }

              [ComImport, Guid("D666063F-1587-4E43-81F1-B948E807363F"),
               InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              public interface IMMDevice
              {
                  [PreserveSig] int Activate(ref Guid iid, int clsCtx, IntPtr activationParams, out IntPtr instance);
                  [PreserveSig] int OpenPropertyStore(int accessMode, out IPropertyStore properties);
                  [PreserveSig] int GetId([MarshalAs(UnmanagedType.LPWStr)] out string id);
                  [PreserveSig] int GetState(out uint state);
              }

              [ComImport, Guid("886D8EEB-8CF2-4446-8D02-CDBA1DBDCF99"),
               InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              public interface IPropertyStore
              {
                  [PreserveSig] int GetCount(out uint count);
                  [PreserveSig] int GetAt(uint index, out PROPERTYKEY key);
                  [PreserveSig] int GetValue(ref PROPERTYKEY key, out PROPVARIANT value);
                  [PreserveSig] int SetValue(ref PROPERTYKEY key, ref PROPVARIANT value);
                  [PreserveSig] int Commit();
              }

              [ComImport, Guid("f8679f50-850a-41cf-9c72-430f290290c8"),
               InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              public interface IPolicyConfig
              {
                  [PreserveSig] int GetMixFormat(string deviceName, out IntPtr format);
                  [PreserveSig] int GetDeviceFormat(string deviceName, bool defaultFormat, out IntPtr format);
                  [PreserveSig] int ResetDeviceFormat(string deviceName);
                  [PreserveSig] int SetDeviceFormat(string deviceName, IntPtr endpointFormat, IntPtr mixFormat);
                  [PreserveSig] int GetProcessingPeriod(string deviceName, bool defaultPeriod, out IntPtr defaultPeriodValue, out IntPtr minimumPeriodValue);
                  [PreserveSig] int SetProcessingPeriod(string deviceName, IntPtr period);
                  [PreserveSig] int GetShareMode(string deviceName, out IntPtr mode);
                  [PreserveSig] int SetShareMode(string deviceName, IntPtr mode);
                  [PreserveSig] int GetPropertyValue(string deviceName, bool fxStore, IntPtr key, IntPtr value);
                  [PreserveSig] int SetPropertyValue(string deviceName, bool fxStore, IntPtr key, IntPtr value);
                  [PreserveSig] int SetDefaultEndpoint([MarshalAs(UnmanagedType.LPWStr)] string deviceName, int role);
                  [PreserveSig] int SetEndpointVisibility([MarshalAs(UnmanagedType.LPWStr)] string deviceName, bool visible);
              }

              public sealed class EndpointInfo
              {
                  public string Id { get; set; }
                  public string Name { get; set; }
                  public string DeviceName { get; set; }
                  public string FriendlyName { get; set; }
                  public uint State { get; set; }
                  public string StateName { get; set; }
              }

              public sealed class DefaultEndpointIds
              {
                  public string Console { get; set; }
                  public string Multimedia { get; set; }
                  public string Communications { get; set; }
              }

              public static class CoreAudio
              {
                  private const int E_RENDER = 0;
                  private const uint DEVICE_STATEMASK_ALL = 0x0000000F;
                  private const int STGM_READ = 0;
                  private const ushort VT_LPWSTR = 31;

                  private static readonly Guid FMTID_DEVICE = new Guid("a45c254e-df1c-4efd-8020-67d146a850e0");
                  private static readonly Guid FMTID_DEVICE_INTERFACE = new Guid("026e516e-b814-414b-83cd-856d6fef4822");

                  [DllImport("ole32.dll")]
                  private static extern int PropVariantClear(ref PROPVARIANT value);

                  private static void ThrowIfFailed(int hr)
                  {
                      if (hr < 0) Marshal.ThrowExceptionForHR(hr);
                  }

                  private static void Release(object value)
                  {
                      if (value != null && Marshal.IsComObject(value))
                      {
                          try { Marshal.ReleaseComObject(value); } catch { }
                      }
                  }

                  private static string ReadString(IPropertyStore store, Guid fmtid, uint pid)
                  {
                      PROPERTYKEY key = new PROPERTYKEY { fmtid = fmtid, pid = pid };
                      PROPVARIANT value = new PROPVARIANT();
                      int hr = store.GetValue(ref key, out value);
                      if (hr < 0) return null;
                      try
                      {
                          if (value.vt == VT_LPWSTR && value.pointerVal != IntPtr.Zero)
                          {
                              return Marshal.PtrToStringUni(value.pointerVal);
                          }
                          return null;
                      }
                      finally
                      {
                          PropVariantClear(ref value);
                      }
                  }

                  private static string GetId(IMMDevice device)
                  {
                      string id;
                      ThrowIfFailed(device.GetId(out id));
                      return id;
                  }

                  private static string StateName(uint state)
                  {
                      switch (state)
                      {
                          case 0x00000001: return "Active";
                          case 0x00000002: return "Disabled";
                          case 0x00000004: return "NotPresent";
                          case 0x00000008: return "Unplugged";
                          default: return "Unknown";
                      }
                  }

                  public static EndpointInfo[] GetRenderEndpoints()
                  {
                      object enumeratorObject = null;
                      IMMDeviceEnumerator enumerator = null;
                      IMMDeviceCollection collection = null;
                      var result = new List<EndpointInfo>();

                      try
                      {
                          enumeratorObject = new MMDeviceEnumeratorComObject();
                          enumerator = (IMMDeviceEnumerator)enumeratorObject;
                          ThrowIfFailed(enumerator.EnumAudioEndpoints(E_RENDER, DEVICE_STATEMASK_ALL, out collection));

                          uint count;
                          ThrowIfFailed(collection.GetCount(out count));
                          for (uint i = 0; i < count; i++)
                          {
                              IMMDevice device = null;
                              IPropertyStore store = null;
                              try
                              {
                                  ThrowIfFailed(collection.Item(i, out device));
                                  string id = GetId(device);
                                  uint state;
                                  ThrowIfFailed(device.GetState(out state));
                                  ThrowIfFailed(device.OpenPropertyStore(STGM_READ, out store));

                                  string name = ReadString(store, FMTID_DEVICE, 2);       // PKEY_Device_DeviceDesc
                                  string adapter = ReadString(store, FMTID_DEVICE_INTERFACE, 2); // PKEY_DeviceInterface_FriendlyName
                                  string friendly = ReadString(store, FMTID_DEVICE, 14); // PKEY_Device_FriendlyName

                                  if (String.IsNullOrWhiteSpace(name)) name = friendly;
                                  if (String.IsNullOrWhiteSpace(adapter)) adapter = friendly;

                                  result.Add(new EndpointInfo
                                  {
                                      Id = id,
                                      Name = name,
                                      DeviceName = adapter,
                                      FriendlyName = friendly,
                                      State = state,
                                      StateName = StateName(state)
                                  });
                              }
                              finally
                              {
                                  Release(store);
                                  Release(device);
                              }
                          }
                      }
                      finally
                      {
                          Release(collection);
                          Release(enumerator);
                          Release(enumeratorObject);
                      }

                      return result.ToArray();
                  }

                  public static string GetDefaultRenderEndpointId(int role)
                  {
                      object enumeratorObject = null;
                      IMMDeviceEnumerator enumerator = null;
                      IMMDevice device = null;
                      try
                      {
                          enumeratorObject = new MMDeviceEnumeratorComObject();
                          enumerator = (IMMDeviceEnumerator)enumeratorObject;
                          ThrowIfFailed(enumerator.GetDefaultAudioEndpoint(E_RENDER, role, out device));
                          return GetId(device);
                      }
                      finally
                      {
                          Release(device);
                          Release(enumerator);
                          Release(enumeratorObject);
                      }
                  }

                  public static DefaultEndpointIds GetDefaultRenderEndpointIds()
                  {
                      return new DefaultEndpointIds
                      {
                          Console = GetDefaultRenderEndpointId(0),
                          Multimedia = GetDefaultRenderEndpointId(1),
                          Communications = GetDefaultRenderEndpointId(2)
                      };
                  }

                  private static void ValidateEndpoint(string deviceId)
                  {
                      object enumeratorObject = null;
                      IMMDeviceEnumerator enumerator = null;
                      IMMDevice device = null;
                      try
                      {
                          enumeratorObject = new MMDeviceEnumeratorComObject();
                          enumerator = (IMMDeviceEnumerator)enumeratorObject;
                          ThrowIfFailed(enumerator.GetDevice(deviceId, out device));
                      }
                      finally
                      {
                          Release(device);
                          Release(enumerator);
                          Release(enumeratorObject);
                      }
                  }

                  public static void SetDefaultEndpointAllRoles(string deviceId)
                  {
                      if (String.IsNullOrWhiteSpace(deviceId))
                          throw new ArgumentException("deviceId must not be empty", "deviceId");

                      ValidateEndpoint(deviceId);

                      object policyObject = null;
                      IPolicyConfig policy = null;
                      try
                      {
                          policyObject = new CPolicyConfigVistaClient();
                          policy = (IPolicyConfig)policyObject;
                          ThrowIfFailed(policy.SetDefaultEndpoint(deviceId, 0));
                          ThrowIfFailed(policy.SetDefaultEndpoint(deviceId, 1));
                          ThrowIfFailed(policy.SetDefaultEndpoint(deviceId, 2));
                      }
                      finally
                      {
                          Release(policy);
                          Release(policyObject);
                      }
                  }
              }
          }
          '@ -ErrorAction Stop
          }

          function Get-CoreAudioRenderDevices {
              [CmdletBinding()]
              param()

              Initialize-CoreAudioBackend
              $defaultId = $null
              try { $defaultId = [AutoSwitch.NativeAudio.CoreAudio]::GetDefaultRenderEndpointId(0) } catch { }

              $rows = [System.Collections.Generic.List[object]]::new()
              foreach ($item in @([AutoSwitch.NativeAudio.CoreAudio]::GetRenderEndpoints())) {
                  $isDefault = $false
                  if ($defaultId) { $isDefault = $item.Id -ieq $defaultId }
                  $rows.Add([pscustomobject][ordered]@{
                      'Name'          = [string]$item.Name
                      'Type'          = 'Device'
                      'Direction'     = 'Render'
                      'Device Name'   = [string]$item.DeviceName
                      'Friendly Name' = [string]$item.FriendlyName
                      'Device State'  = [string]$item.StateName
                      'Item ID'       = [string]$item.Id
                      'Default'       = $(if ($isDefault) { 'Render' } else { '' })
                  })
              }
              return $rows.ToArray()
          }

          function Get-CoreAudioDefaultRenderDeviceId {
              [CmdletBinding()]
              param()

              Initialize-CoreAudioBackend
              return [string][AutoSwitch.NativeAudio.CoreAudio]::GetDefaultRenderEndpointId(0)
          }

          function Get-CoreAudioDefaultRenderDeviceIds {
              [CmdletBinding()]
              param()

              Initialize-CoreAudioBackend
              $ids = [AutoSwitch.NativeAudio.CoreAudio]::GetDefaultRenderEndpointIds()
              return [pscustomobject]@{
                  Console        = [string]$ids.Console
                  Multimedia     = [string]$ids.Multimedia
                  Communications = [string]$ids.Communications
              }
          }

          function Test-CoreAudioDefaultRenderDevice {
              [CmdletBinding()]
              param([Parameter(Mandatory = $true)][string]$DeviceId)

              try {
                  $ids = Get-CoreAudioDefaultRenderDeviceIds
                  return ($ids.Console -ieq $DeviceId -and
                          $ids.Multimedia -ieq $DeviceId -and
                          $ids.Communications -ieq $DeviceId)
              }
              catch {
                  return $false
              }
          }

          function Set-CoreAudioDefaultRenderDevice {
              [CmdletBinding()]
              param([Parameter(Mandatory = $true)][string]$DeviceId)

              Initialize-CoreAudioBackend
              [AutoSwitch.NativeAudio.CoreAudio]::SetDefaultEndpointAllRoles($DeviceId)
          }

          '''

          # lib/AutoSwitchCore.psm1
          path = 'lib/AutoSwitchCore.psm1'
          text = read(path)
          text = text.replace('No G HUB or svcl.exe dependency is required for Pester tests.',
                              'No G HUB or third-party audio utility is required for Pester tests.')
          text = replace_once(text, 'function Get-ConfigDetectionMode {', native_ps + '\nfunction Get-ConfigDetectionMode {', path)
          old_export = 'Export-ModuleMember -Function Get-RenderItemIdFromText, Resolve-HeadsetState, Test-ValidAudioConfig, New-GHubTimeoutToken, ConvertFrom-SvclCsv, ConvertFrom-CsvLine, Get-CsvColumn, Resolve-EndpointState, Resolve-DetectedState, Test-SvclExportValid, Get-SvclRenderDevice, Get-SvclDeviceLabel, Find-SvclRenderDeviceByIdentity, Get-EndpointFxState, Get-ConfigDetectionMode'
          new_export = old_export + ', Initialize-CoreAudioBackend, Get-CoreAudioRenderDevices, Get-CoreAudioDefaultRenderDeviceId, Get-CoreAudioDefaultRenderDeviceIds, Test-CoreAudioDefaultRenderDevice, Set-CoreAudioDefaultRenderDevice'
          text = replace_once(text, old_export, new_export, path)
          write(path, text)

          # Runtime-PROX2-AutoSwitch.ps1
          path = 'Runtime-PROX2-AutoSwitch.ps1'
          text = read(path)
          text = text.replace('$SvclPath   = Join-Path $InstallDir "svcl.exe"\n', '')
          text = text.replace('if (-not (Test-Path $SvclPath))   { exit 11 }\n', '')
          text = text.replace('# Logica compartida (extraccion de Item ID, debounce, CSV, estados, config).',
                              '# Shared logic (Core Audio interop, debounce, endpoint identity, config).')
          text = sub_once(text,
              r'function Get-DefaultRenderItemId \{.*?\n\}\n\nfunction Set-AudioOutput \{.*?\n\}\n\n# --- Windows endpoint state',
              '''function Get-DefaultRenderItemId {\n    return Get-CoreAudioDefaultRenderDeviceId\n}\n\nfunction Set-AudioOutput {\n    param(\n        [Parameter(Mandatory=$true)][string]$DeviceId,\n        [Parameter(Mandatory=$true)][string]$Label\n    )\n\n    $current = $null\n    try { $current = Get-DefaultRenderItemId } catch { }\n\n    if ($current -and ($current -ieq $DeviceId) -and\n        (Test-CoreAudioDefaultRenderDevice -DeviceId $DeviceId)) {\n        return\n    }\n\n    Set-CoreAudioDefaultRenderDevice -DeviceId $DeviceId\n    Start-Sleep -Milliseconds 350\n\n    if (Test-CoreAudioDefaultRenderDevice -DeviceId $DeviceId) {\n        Write-AutoSwitchLog "Output changed -> $Label"\n        return\n    }\n\n    # Retry once in case Windows was recreating the endpoint.\n    Start-Sleep -Milliseconds 500\n    Set-CoreAudioDefaultRenderDevice -DeviceId $DeviceId\n    Start-Sleep -Milliseconds 350\n\n    if (Test-CoreAudioDefaultRenderDevice -DeviceId $DeviceId) {\n        Write-AutoSwitchLog "Output changed -> $Label (second attempt)"\n        return\n    }\n\n    $roles = $null\n    try { $roles = Get-CoreAudioDefaultRenderDeviceIds } catch { }\n    throw "Core Audio could not set '$Label' for all roles. Expected=$DeviceId Actual=$($roles | ConvertTo-Json -Compress)"\n}\n\n# --- Windows endpoint state''',
              path, flags=re.S)
          text = sub_once(text,
              r'function Get-SvclCsvExport \{.*?\n\}\n\nfunction Get-HeadsetEndpointState \{.*?\n\}\n\n# --- Tray icon',
              '''function Get-HeadsetEndpointState {\n    <#\n    .SYNOPSIS\n        Returns 'Connected' / 'Disconnected' / 'Unknown' for the headset endpoint.\n    .DESCRIPTION\n        - Successful Core Audio enumeration + matching Item ID -> normalized state.\n        - Successful enumeration + missing endpoint -> Disconnected.\n        - Core Audio failure -> Unknown (do nothing).\n    #>\n    try {\n        $rows = @(Get-CoreAudioRenderDevices)\n    }\n    catch {\n        return 'Unknown'\n    }\n\n    $row = $rows |\n        Where-Object {\n            $id = Get-CsvColumn -Row $_ -Names @('Item ID')\n            $null -ne $id -and $id.Trim().ToLowerInvariant() -eq [string]$Config.HeadsetId\n        } |\n        Select-Object -First 1\n\n    if (-not $row) {\n        return 'Disconnected'\n    }\n\n    $state = Get-CsvColumn -Row $row -Names @('Device State', 'State')\n    if ($null -eq $state) {\n        return 'Unknown'\n    }\n\n    return Resolve-EndpointState -State $state\n}\n\n# --- Tray icon''',
              path, flags=re.S)
          text = sub_once(text,
              r'function Get-RenderDevicesFromCsv \{.*?\n\}',
              '''function Get-RenderDevices {\n    try { return @(Get-CoreAudioRenderDevices) }\n    catch { return @() }\n}''', path, flags=re.S)
          text = text.replace('$devices = Get-RenderDevicesFromCsv', '$devices = Get-RenderDevices')
          text = sub_once(text,
              r'    \$csv = Get-SvclCsvExport\n    if \(-not \(Test-SvclExportValid -CsvText \$csv\)\) \{.*?\n    \}\n\n    \$rows = @\(ConvertFrom-SvclCsv -Text \$csv\)',
              '''    try {\n        $rows = @(Get-CoreAudioRenderDevices)\n    }\n    catch {\n        if ($Diagnose) { Write-AutoSwitchLog ("Get-HeadsetStateForId: Core Audio enumeration failed for {0}: {1}" -f $ItemId, $_.Exception.Message) }\n        return 'Unknown'\n    }''', path, flags=re.S)
          text = text.replace('Bluetooth headsets can disappear from the svcl export while off and',
                              'Bluetooth headsets can disappear from the Core Audio endpoint list while off and')
          text = text.replace('stable across reconnects). Returns Connected/Disconnected/Unknown.',
                              'stable across reconnects). Returns Connected/Disconnected/Unknown.')
          text = text.replace('What is in the export? Render devices with their states and IDs.',
                              'What is currently in Core Audio? Render devices with their states and IDs.')
          text = text.replace('in the export. Available row(s):', 'in Core Audio. Available endpoint(s):')
          text = text.replace('Could not read the Windows output devices. Is svcl.exe present and the audio system OK?',
                              'Could not read the Windows output devices through Core Audio.')
          text = text.replace('# The polling (svcl/G HUB, Set-AudioOutput) runs in a PowerShell process',
                              '# The polling (Core Audio/G HUB, Set-AudioOutput) runs in a PowerShell process')
          text = text.replace('(for example a slow /SetDefault or G HUB timeout)',
                              '(for example a slow Core Audio switch or G HUB timeout)')
          write(path, text)

          # Instalar-PROX2-AutoSwitch.ps1
          path = 'Instalar-PROX2-AutoSwitch.ps1'
          text = read(path)
          text = text.replace('# PowerShell 5.1 on old .NET can negotiate TLS 1.0/1.1 and fail against\n# GitHub/NirSoft. Force TLS 1.2.\n[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n\n', '')
          text = text.replace('$SvclPath     = Join-Path $InstallDir "svcl.exe"\n', '')
          text = sub_once(text, r'\n\$SvclUrl = .*?\n\$ZipPath = .*?\n', '\n', path, flags=re.S)
          text = sub_once(text,
              r'# SoundVolumeCommandLine: skip the download if svcl\.exe is already installed\..*?# Copy the source version of the runtime and utilities\.',
              '''# Native Core Audio backend: no third-party audio executable is downloaded.\nWrite-Host "[1/6] Checking native Windows Core Audio..." -ForegroundColor Yellow\ntry {\n    $nativeDevices = @(Get-CoreAudioRenderDevices)\n    if ($nativeDevices.Count -eq 0) {\n        throw "Windows returned no render endpoints."\n    }\n    [void](Get-CoreAudioDefaultRenderDeviceId)\n}\ncatch {\n    throw "Native Windows Core Audio is unavailable: $($_.Exception.Message)"\n}\nWrite-Host "      Core Audio OK ($($nativeDevices.Count) render endpoint(s))." -ForegroundColor Green\n\n# Remove a stale dependency left by installations older than the native backend.\n$legacySvclPath = Join-Path $InstallDir "svcl.exe"\nif (Test-Path $legacySvclPath) {\n    Remove-Item $legacySvclPath -Force -ErrorAction SilentlyContinue\n}\n\n# Copy the source version of the runtime and utilities.''',
              path, flags=re.S)
          text = text.replace('[3/7]', '[2/6]').replace('[4/7]', '[3/6]').replace('[5/7]', '[4/6]').replace('[6/7]', '[5/6]').replace('[7/7]', '[6/6]')
          text = sub_once(text,
              r'function Get-DefaultColumn \{.*?\n\}\n\nfunction Get-DefaultRenderItemId \{.*?\n\}',
              '''function Get-DefaultRenderItemId {\n    return Get-CoreAudioDefaultRenderDeviceId\n}''', path, flags=re.S)
          text = sub_once(text,
              r'function Test-SetDefault \{.*?\n\}\n\ntry \{',
              '''function Test-SetDefault {\n    param(\n        [Parameter(Mandatory=$true)][string]$Id,\n        [Parameter(Mandatory=$true)][string]$Label\n    )\n\n    Write-Host ""\n    Write-Host "Testing real switch -> $Label" -ForegroundColor Yellow\n\n    try {\n        Set-CoreAudioDefaultRenderDevice -DeviceId $Id\n    }\n    catch {\n        Write-Host ("      TEST FAILED. Core Audio error: {0}" -f $_.Exception.Message) -ForegroundColor Red\n        return $false\n    }\n\n    Start-Sleep -Milliseconds 800\n    if (Test-CoreAudioDefaultRenderDevice -DeviceId $Id) {\n        Write-Host "      TEST OK (Console/Multimedia/Communications)" -ForegroundColor Green\n        return $true\n    }\n\n    $actual = $null\n    try { $actual = Get-CoreAudioDefaultRenderDeviceIds } catch { }\n    Write-Host ("      TEST FAILED. Actual roles: {0}" -f ($actual | ConvertTo-Json -Compress)) -ForegroundColor Red\n    return $false\n}\n\ntry {''', path, flags=re.S)
          text = sub_once(text,
              r'    \$csvText = \(& \$SvclPath /scomma "" 2>&1 \| Out-String\)\.Trim\(\)\n    if \(\[string\]::IsNullOrWhiteSpace\(\$csvText\)\) \{.*?\n    \}\n\n    \$renderRows = @\(Get-SvclRenderDevice -CsvText \$csvText\)',
              '''    try {\n        $renderRows = @(Get-CoreAudioRenderDevices)\n    }\n    catch {\n        throw "Could not read the Windows audio device list through Core Audio: $($_.Exception.Message)"\n    }''', path, flags=re.S)
          text = sub_once(text,
              r'        \$txt = \(& \$SvclPath /scomma "" 2>&1 \| Out-String\)\.Trim\(\)\n        if \(-not \(Test-SvclExportValid -CsvText \$txt\)\) \{\n            return \[pscustomobject\]@\{ State = \'Unknown\'; FoundId = \$null \}\n        \}\n\n        \$rows = @\(ConvertFrom-SvclCsv -Text \$txt\)',
              '''        try {\n            $rows = @(Get-CoreAudioRenderDevices)\n        }\n        catch {\n            return [pscustomobject]@{ State = 'Unknown'; FoundId = $null }\n        }''', path)
          text = text.replace('Resolve the same Render endpoint by its real svcl identity rather than',
                              'Resolve the same Render endpoint by its native Core Audio identity rather than')
          write(path, text)

          # Verificar-PROX2-AutoSwitch.ps1
          path = 'Verificar-PROX2-AutoSwitch.ps1'
          text = read(path)
          text = text.replace('$SvclPath     = Join-Path $InstallDir "svcl.exe"\n', '')
          text = text.replace('Show-Test "svcl.exe" (Test-Path $SvclPath) $SvclPath\n', '')
          text = text.replace('# Module functions (Get-ConfigDetectionMode, ConvertFrom-SvclCsv, Get-EndpointFxState).',
                              '# Module functions (Core Audio backend, detection mode and enhancements).')
          marker = '''if (Test-Path $ModulePath) {\n    Import-Module $ModulePath -ErrorAction SilentlyContinue\n}\n'''
          insert = marker + '''\n$coreAudioOk = $false\n$coreAudioDetail = 'Module unavailable'\nif (Test-Path $ModulePath) {\n    try {\n        $render = @(Get-CoreAudioRenderDevices)\n        $defaultId = Get-CoreAudioDefaultRenderDeviceId\n        $coreAudioOk = ($render.Count -gt 0 -and -not [string]::IsNullOrWhiteSpace($defaultId))\n        $coreAudioDetail = "$($render.Count) render endpoint(s); default=$defaultId"\n    }\n    catch {\n        $coreAudioDetail = $_.Exception.Message\n    }\n}\nShow-Test "Native Windows Core Audio" $coreAudioOk $coreAudioDetail\n'''
          text = replace_once(text, marker, insert, path)
          text = sub_once(text,
              r'                \$csv = \(& \$SvclPath /scomma "" 2>&1 \| Out-String\)\.Trim\(\)\n                \$rows = @\(ConvertFrom-SvclCsv -Text \$csv\)',
              '                $rows = @(Get-CoreAudioRenderDevices)', path)
          write(path, text)

          # README.md
          path = 'README.md'
          text = read(path)
          text = text.replace('SoundVolumeCommandLine /SetDefault <Item ID> all', 'Windows Core Audio / IPolicyConfig → all default roles')
          text = text.replace('A transient `svcl.exe` or G HUB failure therefore cannot send audio to the wrong device on a single bad read.',
                              'A transient Core Audio or G HUB failure therefore cannot send audio to the wrong device on a single bad read.')
          text = text.replace('- Internet access during installation so `svcl.exe` can be downloaded and hash-verified.\n', '')
          text = text.replace('- downloads SoundVolumeCommandLine from NirSoft only when needed and verifies its SHA-256 before execution;',
                              '- uses the Windows Core Audio APIs in-process, so no third-party audio-control executable is downloaded;')
          text = sub_once(text,
              r'\n## Important `svcl\.exe` regression guard\n.*?\n## Security\n',
              '\n## Native Windows audio backend\n\nEndpoint enumeration, state reads and default-device verification now use Windows Core Audio directly in-process. The project keeps its existing PowerShell structure and embedded C# COM bridge; no separate audio-control executable is downloaded. Setting the default endpoint uses the same `IPolicyConfig` COM interop family already used by the project for Audio Enhancements, and every switch is verified across Console, Multimedia and Communications roles with one bounded retry.\n\n## Security\n',
              path, flags=re.S)
          text = text.replace('- The installer verifies the SHA-256 of the NirSoft download before running it.\n',
                              '- Audio endpoint enumeration and switching run in-process; installation no longer downloads a third-party audio-control binary.\n')
          write(path, text)

          # AGENT.md
          path = 'AGENT.md'
          text = read(path)
          text = text.replace('  `svcl.exe /scomma` export and map it:', '  native Core Audio endpoint list and map it:')
          text = text.replace('the two real `svcl`\n   identity columns (`Device Name` + `Name`)',
                              'the two native endpoint identity properties\n   (`PKEY_DeviceInterface_FriendlyName` + `PKEY_Device_DeviceDesc`)')
          text = sub_once(text,
              r'3\. To set the output:.*?6\. Unknown state \(svcl failure, `Disabled`, garbage\):',
              '''3. To set the output, use the in-process Core Audio bridge in `lib/AutoSwitchCore.psm1`.\n   `Set-CoreAudioDefaultRenderDevice` applies the target to Console, Multimedia and Communications.\n\n4. To read the current defaults, use `Get-CoreAudioDefaultRenderDeviceIds`.\n   Do not infer success from the setter alone.\n\n5. Verify every switch:\n   - set all three roles;\n   - re-read Console, Multimedia and Communications;\n   - require every role to match the target;\n   - allow a single short retry.\n\n6. Unknown state (Core Audio failure, `Disabled`, unmapped state):''',
              path, flags=re.S)
          text = text.replace('Do NOT run svcl/G HUB/Set-AudioOutput on the UI thread.',
                              'Do NOT run Core Audio/G HUB/Set-AudioOutput on the UI thread.')
          text = text.replace('    Do **NOT** use `svcl /SetBooleanFxProperty` for this (individual effects only, not the global\n    "Disable audio enhancements" switch).\n', '')
          text = text.replace('    `Add-Type` and expose a static method (`AutoSwitch.AudioEnhancements.SetSysFx`,\n    `AutoSwitch.EndpointFx.ReadSysFx`).',
                              '    `Add-Type` and expose static methods for endpoint enumeration/default switching and enhancements.')
          text = sub_once(text,
              r'\n## SoundVolumeCommandLine\n.*?\n## Required tests after any change\n',
              '''\n## Native Core Audio backend\n\n- `IMMDeviceEnumerator` / `IMMDevice` enumerate render endpoints, states and endpoint IDs.\n- `IPropertyStore` reads `PKEY_Device_DeviceDesc`, `PKEY_DeviceInterface_FriendlyName` and `PKEY_Device_FriendlyName`.\n- `IPolicyConfig::SetDefaultEndpoint` is used for Console, Multimedia and Communications, then all three roles are re-read and verified.\n- `IPolicyConfig` is not a documented public Windows API. This project already depended on the same COM family for Audio Enhancements; keep the boundary isolated in embedded C# and fail safely on HRESULT errors.\n- Clean install no longer downloads or hashes a third-party audio-control executable.\n\n## Required tests after any change\n''',
              path, flags=re.S)
          text = text.replace('- NirSoft hash differs: abort install.\n', '')
          text = text.replace('- svcl `State` read fails or is `Disabled`/garbage: `Unknown`, do not switch.',
                              '- Core Audio enumeration/state read fails or is `Disabled`/unmapped: `Unknown`, do not switch.')
          write(path, text)

          # SOURCES.md: add authoritative Windows Core Audio sources and remove NirSoft section if present.
          path = 'SOURCES.md'
          text = read(path)
          text = re.sub(r'\n## .*?(?:SoundVolumeCommandLine|NirSoft).*?(?=\n## |\Z)', '\n', text, flags=re.S | re.I)
          if 'IMMDeviceEnumerator::EnumAudioEndpoints' not in text:
              text += '''\n\n## Windows Core Audio endpoint APIs\n\n- Microsoft Learn — `IMMDeviceEnumerator::EnumAudioEndpoints`: documents render/capture endpoint enumeration and device-state masks.\n  https://learn.microsoft.com/windows/win32/api/mmdeviceapi/nf-mmdeviceapi-immdeviceenumerator-enumaudioendpoints\n- Microsoft Learn — Core Audio device properties: documents `PKEY_DeviceInterface_FriendlyName`, `PKEY_Device_DeviceDesc`, `PKEY_Device_FriendlyName`, endpoint IDs and container IDs.\n  https://learn.microsoft.com/windows/win32/coreaudio/device-properties\n- Microsoft Learn — `IMMDeviceEnumerator::GetDefaultAudioEndpoint`: documents reading the current default endpoint by role.\n  https://learn.microsoft.com/windows/win32/api/mmdeviceapi/nf-mmdeviceapi-immdeviceenumerator-getdefaultaudioendpoint\n\n`IPolicyConfig::SetDefaultEndpoint` is an undocumented Windows COM interface. It is intentionally isolated inside the embedded C# bridge and is treated as a compatibility risk, not as a supported Microsoft API.\n'''
          write(path, text)

          # CHANGELOG.md
          path = 'CHANGELOG.md'
          text = read(path)
          note = '''\n### Changed\n\n- Replaced the downloaded SoundVolumeCommandLine dependency with an in-process Windows Core Audio COM backend for endpoint enumeration, state reads, default-device reads and output switching.\n- Default-output changes are now verified across Console, Multimedia and Communications roles before being accepted.\n- Clean installs remove a stale legacy `svcl.exe` when present and no longer require a third-party audio-control download.\n'''
          if 'in-process Windows Core Audio COM backend' not in text:
              if '## [Unreleased]' in text:
                  text = text.replace('## [Unreleased]', '## [Unreleased]' + note, 1)
              else:
                  text = '# Changelog\n\n## [Unreleased]' + note + '\n' + text
          write(path, text)

          # tests/AutoSwitchCore.Tests.ps1
          path = 'tests/AutoSwitchCore.Tests.ps1'
          text = read(path)
          if "Describe 'Native Core Audio bridge'" not in text:
              text += r'''\n\nDescribe 'Native Core Audio bridge' {\n    It 'exports the native Core Audio commands' {\n        (Get-Command Initialize-CoreAudioBackend -ErrorAction Stop).Name | Should -Be 'Initialize-CoreAudioBackend'\n        (Get-Command Get-CoreAudioRenderDevices -ErrorAction Stop).Name | Should -Be 'Get-CoreAudioRenderDevices'\n        (Get-Command Get-CoreAudioDefaultRenderDeviceId -ErrorAction Stop).Name | Should -Be 'Get-CoreAudioDefaultRenderDeviceId'\n        (Get-Command Set-CoreAudioDefaultRenderDevice -ErrorAction Stop).Name | Should -Be 'Set-CoreAudioDefaultRenderDevice'\n    }\n\n    It 'compiles the embedded COM bridge without touching hardware' {\n        { Initialize-CoreAudioBackend } | Should -Not -Throw\n        ('AutoSwitch.NativeAudio.CoreAudio' -as [type]) | Should -Not -BeNullOrEmpty\n    }\n}\n'''.replace('\\n', '\n')
          write(path, text)

          # One-shot workflow: remove itself from the final branch diff.
          Path('.github/workflows/apply-native-core-audio.yml').unlink()

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem -Path . -Include '*.ps1','*.psm1' -File -Recurse
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.FullName): $($_.Message) (line $($_.Extent.StartLineNumber))" }
              exit 1
            }
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Ensure external svcl dependency is gone from active code/docs
        shell: pwsh
        run: |
          $hits = git grep -n -i -E 'svcl\.exe|SoundVolumeCommandLine|NirSoft' -- ':!CHANGELOG.md' ':!docs/WindowsEndpointProvider.md' ':!wiki/*' ':!site/*' 2>$null
          if ($hits) {
            $hits | Write-Host
            throw 'Active code or canonical docs still reference the removed svcl dependency.'
          }

      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'feat: replace svcl with native Core Audio'
          git push origin HEAD:agent/native-core-audio
