name: tmp-fix-wiki-tray

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-wiki-tray.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix tray screenshot in real Wiki pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/autoswitch-wiki
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/autoswitch-wiki
          cd /tmp/autoswitch-wiki
          url='https://raw.githubusercontent.com/Ayerdi/PROX2-AutoSwitch/main/site/assets/tray-menu.png'

          add_block() {
            file="$1"
            title="$2"
            caption="$3"
            test -f "$file"
            if ! grep -Fq "$url" "$file"; then
              printf '\n\n## %s\n\n![Real AutoSwitch tray menu](%s)\n\n%s\n' "$title" "$url" "$caption" >> "$file"
            fi
          }

          add_block 'Home.md' 'Tray menu / Menú de la bandeja' 'Real example with a Logitech PRO X 2 configured. Device names vary by system. / Ejemplo real con un Logitech PRO X 2 configurado. Los nombres de los dispositivos varían según el equipo.'
          add_block 'Verificar-ES.md' 'Captura del menú de bandeja' 'Ejemplo real con un Logitech PRO X 2 configurado. Los nombres del auricular y del fallback dependen de cada equipo.'
          add_block 'Verify-EN.md' 'Tray menu screenshot' 'Real example with a Logitech PRO X 2 configured. Headset and fallback names vary from system to system.'

          echo '=== Screenshot markers ==='
          for f in Home.md Verificar-ES.md Verify-EN.md; do
            printf '%s: ' "$f"
            grep -Fq "$url" "$f" && echo OK
          done

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Home.md Verificar-ES.md Verify-EN.md
            git commit -m 'docs: add tray screenshot to verification wiki pages'
            git push origin HEAD:master
          fi
          echo "WIKI_HEAD=$(git rev-parse HEAD)"

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-wiki-tray.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove wiki tray fix workflow'
          git push origin HEAD:main
