name: tmp-onboarding-hardening

on:
  push:
    paths:
      - '.github/workflows/tmp-onboarding-hardening.yml'
      - '.github/tmp_onboarding_finish.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/onboarding-hardening
          fetch-depth: 0

      - name: Apply onboarding hardening
        shell: bash
        run: |
          set +e
          python3 .github/tmp_onboarding_hardening.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            exit "$code"
          fi
          python3 .github/tmp_onboarding_finish.py

      - name: Commit non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/tmp_onboarding_hardening.py .github/tmp_onboarding_finish.py
          rm -f .github/tmp_add_tray_image.py .github/tmp_tray_reconcile.py .github/tmp_tray_final_reconcile.py
          # GitHub Apps cannot push workflow-file changes without the workflows
          # permission. Restore all workflow files; they are updated/cleaned via
          # the GitHub connector after this job pushes the regular files.
          git restore --source=HEAD -- .github/workflows
          git add -A
          git diff --cached --check
          git commit -m "feat: harden onboarding and quick install"
          git push origin HEAD:agent/onboarding-hardening
