name: validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve canonical version
        id: version
        shell: bash
        run: |
          version="$(cat VERSION | tr -d '\r\n')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Repository quality
        run: python3 scripts/check-repository.py
      - name: English canonical language guard
        run: python3 scripts/check-language.py
      - name: Validate Bash scripts
        run: bash -n scripts/*.sh
      - name: Deterministic release build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/build-release.sh "$VERSION"
          first="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${VERSION}.zip.sha256")"
          cp "dist/PROX2-AutoSwitch-v${VERSION}.zip" /tmp/autoswitch-first.zip
          rm -f dist/*.zip dist/*.sha256
          bash scripts/build-release.sh "$VERSION"
          second="$(cut -d' ' -f1 "dist/PROX2-AutoSwitch-v${VERSION}.zip.sha256")"
          test "$first" = "$second"
          cmp /tmp/autoswitch-first.zip "dist/PROX2-AutoSwitch-v${VERSION}.zip"
          cmp "dist/PROX2-AutoSwitch-v${VERSION}.zip" dist/Audio-AutoSwitch.zip
          python3 scripts/check-release-readiness.py --version "$VERSION" --package-only

  powershell:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $scripts=Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1' }
          foreach($script in $scripts){$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error "$($script.FullName): $($_.Message)"};exit 1}}
      - name: Install validation modules
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $r=Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSAvoidUsingPlainTextForPassword,PSAvoidUsingCmdletAliases,PSAvoidUsingEmptyCatchBlock,PSUseApprovedVerbs,PSUseShouldProcessForStateChangingFunctions,PSUseSingularNouns
          if($r){$r|Format-Table -AutoSize|Out-String|Write-Host;exit 1}
      - name: Pester
        shell: powershell
        run: Import-Module Pester -RequiredVersion 5.9.0; Invoke-Pester -Path .\tests -CI

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/run-gitleaks.sh

  # Stable aggregate check for branch-protection configurations that require
  # a single "validate" context. It succeeds only when every component check
  # above succeeds, while the component checks remain individually visible.
  validate:
    name: validate
    if: always()
    needs:
      - quality
      - powershell
      - secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm component checks
        run: |
          test '${{ needs.quality.result }}' = 'success'
          test '${{ needs.powershell.result }}' = 'success'
          test '${{ needs.secrets.result }}' = 'success'
